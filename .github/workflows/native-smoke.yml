name: Clean-install native smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["candidate", "published"]') || fromJSON('["candidate"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Read installation contract
        id: contract
        run: |
          source script/ci/versions.env
          echo "ruby=$RUBY_VERSION" >> "$GITHUB_OUTPUT"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.contract.outputs.ruby }}
      - name: Run framework and packaging tests
        run: ruby -Ilib -e 'Dir["test/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
      - name: Build candidate gem
        if: matrix.mode == 'candidate'
        run: |
          mkdir -p tmp
          gem build hamster-web.gemspec --output tmp/hamster-web.gem
      - name: Run isolated Linux consumer
        env:
          MODE: ${{ matrix.mode }}
        run: |
          if [[ "$MODE" == candidate ]]; then
            bash script/ci/run_native_smoke.sh candidate tmp/hamster-web.gem
          else
            bash script/ci/run_native_smoke.sh published
          fi
      - name: Clean up smoke resources
        if: always()
        run: |
          docker ps -aq --filter label=io.hamster.native-smoke=true | xargs -r docker rm -fv
          docker network ls -q --filter label=io.hamster.native-smoke=true | xargs -r docker network rm
          docker image ls -q --filter label=io.hamster.native-smoke=true | sort -u | xargs -r docker image rm -f
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.mode }}
          path: tmp/native-smoke-${{ matrix.mode }}/
          if-no-files-found: ignore

  generated-app-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate, build, migrate and serve with Docker only
        run: bash script/ci/run_app_docker_smoke.sh
      - name: Clean up generated-app resources
        if: always()
        run: |
          docker ps -aq --filter label=io.hamster.app-smoke=true | xargs -r docker rm -fv
          docker network ls -q --filter label=io.hamster.app-smoke=true | xargs -r docker network rm
          docker image ls -q --filter label=io.hamster.app-smoke=true | sort -u | xargs -r docker image rm -f
      - name: Upload generated-app diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-app-docker
          path: tmp/app-docker-smoke/
          if-no-files-found: ignore

  frontend-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned native toolchain and server
        run: |
          source script/ci/versions.env
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev pkg-config
          git clone https://github.com/matz/spinel.git /tmp/hamster-spinel
          git -C /tmp/hamster-spinel checkout --detach "$SPINEL_REVISION"
          make -C /tmp/hamster-spinel deps
          make -C /tmp/hamster-spinel -j2
          make -C /tmp/hamster-spinel install PREFIX="$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gem install spinel-spinner --version "$SPINNER_VERSION" --no-document
      - name: Native and browser frontend acceptance
        run: |
          ruby -Ilib examples/frontend/generate.rb ../../tmp
          export HAMSTER_BROWSER_BINARY="$(command -v google-chrome)"
          export HAMSTER_BROWSER_ARTIFACT="$PWD/tmp/frontend-browser.html"
          test -n "$HAMSTER_BROWSER_BINARY"
          ruby -Ilib -rhamster/native_smoke -e 'Hamster::NativeSmoke.run(File.expand_path("tmp/frontend_demo"))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-browser
          path: tmp/frontend-browser.html
          if-no-files-found: ignore
